# リリースタグ（v*）が満たすべき前提を機械で検査する。README「リリース」が散文で定めている
# 2 点 —— タグは annotated で打つこと、`VERSION` がタグ名と一致すること —— は手順書だけでは
# 守られず、実際に過去のタグは lightweight / annotated が混在した。lightweight タグは
# `git describe`（`--tags` 無し）から無視されるため、submodule で pin した版を確認すると
# 1 つ前のリリースが表示される。押した直後に赤で気付けるようにする。
name: Release Tag

on:
  push:
    tags: ["v*"]

# 検査のみで書き込み不要。
permissions:
  contents: read

jobs:
  check:
    # 検査内容が git とテキスト比較だけで OS に依存しないため、ci.yml の windows-latest
    # （PowerShell の解析と Pester に要る）と違って ubuntu で足りる。
    runs-on: ubuntu-latest
    steps:
      # VERSION を読むためだけなので浅い clone でよい（タグの種別はここでは取れない。下記）。
      - uses: actions/checkout@v5

      # actions/checkout はタグ push でも refspec `+<コミット SHA>:refs/tags/<名前>` で取るため、
      # ローカルの refs/tags/<名前> は annotated タグでもコミットを直接指す（fetch-depth を
      # 増やしても変わらない）。種別を見るにはタグ ref そのものを取り直す必要がある。
      # v0.23.2 の push で、これを省いた版が正しく打ったタグを lightweight と誤検知した。
      #
      # $GITHUB_REF_NAME は Actions が渡す環境変数。${{ }} で式を run へ展開すると
      # タグ名経由のスクリプト注入を許すため、環境変数のまま参照する。
      - name: タグが annotated か
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          type=$(git cat-file -t "$GITHUB_REF_NAME")
          if [ "$type" != tag ]; then
            echo "::error::$GITHUB_REF_NAME は lightweight タグ（$type）。annotated で打ち直す: git tag -f -a $GITHUB_REF_NAME -m $GITHUB_REF_NAME && git push -f origin $GITHUB_REF_NAME"
            exit 1
          fi
          echo "$GITHUB_REF_NAME: annotated"

      # VERSION は LF 固定（.gitattributes）だが、Windows 側で書かれて CR が混じっても
      # 「見た目は同じなのに不一致」で悩まないよう落としてから比べる。
      - name: VERSION がタグ名と一致するか
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          have=$(tr -d '\r' < VERSION)
          if [ "$want" != "$have" ]; then
            echo "::error::VERSION ($have) がタグ ($GITHUB_REF_NAME) と一致しない。どちらかを直す"
            exit 1
          fi
          echo "VERSION: $have"
