name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN を最小権限に絞る（CI はチェックアウトと検査のみで書き込み不要）。
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      # 実際に動く commit は .github/workflows/actions.lock が固定する（タグ付け替えを防ぐ）。
      # uses: を変えたら gh actions-lock を流し直す。版の更新は Dependabot が lockfile ごと PR で運ぶ。
      - uses: actions/checkout@v7.0.1

      - name: Syntax parse (PowerShell AST)
        shell: pwsh
        run: |
          $files = @('./win.ps1') + @(Get-ChildItem ./lib, ./bin -Filter '*.ps1' -ErrorAction SilentlyContinue | ForEach-Object FullName)
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error (('{0}: {1}' -f $file, $_.Message)) }; exit 1 }
          }
          Write-Host 'OK: no parse errors'

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -MinimumVersion 1.21.0 -Force -Scope CurrentUser
          $paths = @('./win.ps1') + @(Get-ChildItem ./lib, ./bin -Filter '*.ps1' -ErrorAction SilentlyContinue | ForEach-Object FullName)
          $issues = foreach ($path in $paths) { Invoke-ScriptAnalyzer -Path $path -Settings ./PSScriptAnalyzerSettings.psd1 }
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object Severity -eq 'Error') { exit 1 }

      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg

  # scripts/tagpr/（kan/tagpr-scripts の git subtree）と、tagpr.yml / tagpr-label.yml が呼ぶ
  # 共通の workflow の SHA が揃っているかを確かめる。subtree pull で SHA を上げ忘れた、SHA だけを
  # 上げた、scripts/tagpr/ を手で編集した、のどれでも落ちる。詳細は tagpr-scripts の README
  # 「The tagpr workflow」。
  tagpr-subtree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # booch-win 本体は Node を使わない。tagpr-scripts のテストと postVersionCommand と同じ 24 に揃える。
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: scripts/tagpr/ が tagpr workflow の SHA と一致するか
        run: node scripts/tagpr/verify-subtree.mjs
